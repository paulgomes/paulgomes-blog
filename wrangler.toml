name = "paulgomes-blog"
compatibility_date = "2026-05-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "paulgomes-painel"
database_id = "cde7e049-faf1-4a18-8410-df2439bf226f"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "paulgomes-uploads"

# Cloudflare Email Service — Email Sending (public beta).
# Envia emails transacionais direto do Worker via env.EMAIL.send(), sem API key.
# Pré-requisito: verificar o domínio remetente (paulgomes.com.br) no painel
# Cloudflare → Email → Email Service. Requer plano Workers Paid.
[[send_email]]
name = "EMAIL"

[vars]
PUBLIC_R2_DOMAIN = "https://media.paulgomes.com.br"
GITHUB_REPO = "paulgomes/paulgomes-blog"
GITHUB_BRANCH = "main"
RESEND_AUDIENCE_ID = "979da1cd-a821-4b9a-935e-b3c07ef1046f"
SITE_URL = "https://paulgomes.com.br"
