name: Publicar posts agendados

# Publica os posts marcados como "Agendado" cujo horário já chegou.
# Bate num endpoint do site (/api/cron/publish-scheduled) autenticado por segredo.
# O endpoint só publica drafts com status='scheduled' e scheduled_at <= agora.

on:
  schedule:
    # A cada 15 min. (O GitHub pode atrasar execuções agendadas em horários de pico.)
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # permite rodar manualmente em Actions → Run workflow

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar endpoint de publicação agendada
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Secret CRON_SECRET ainda não configurado no repositório — pulando (setup pendente)."
            exit 0
          fi
          code=$(curl -sS -m 60 -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://paulgomes.com.br/api/cron/publish-scheduled)
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          if [ "$code" = "503" ]; then
            echo "::warning::Endpoint diz que CRON_SECRET não está no Cloudflare ainda — setup pendente."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Endpoint retornou HTTP $code"
            exit 1
          fi
